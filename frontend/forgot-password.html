<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Forgot Password – AgriMarket</title><link rel="stylesheet" href="/static/css/style.css"/></head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><div class="icon">🌾</div><h1>Reset Password</h1><p style="color:var(--muted);font-size:.9rem;margin-top:.25rem">Change your AgriMarket password securely</p></div>
    <div id="err" style="display:none;background:#fce4ec;color:#c62828;padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.9rem"></div>
    <p style="color:var(--muted);font-size:.9rem;margin-bottom:1.25rem">Enter your registered email and we will send an OTP to your mail.</p>
    <div class="form-group"><label>Email</label><input type="email" id="reset-email" class="form-control" placeholder="Enter your registered email"/></div>
    <button class="btn btn-green btn-full" id="send-otp-btn" onclick="sendResetOtp()">Send OTP</button>
    <div id="reset-fields" style="display:none;margin-top:1.25rem">
      <div class="form-group"><label>OTP from email</label><input type="text" id="reset-otp" class="form-control" inputmode="numeric" maxlength="6" placeholder="Enter 6-digit OTP"/></div>
      <div class="form-group"><label>New password</label><input type="password" id="new-password" class="form-control" placeholder="Enter your new password"/></div>
      <button class="btn btn-green btn-full" onclick="resetPassword()">Change Password</button>
    </div>
    <div class="text-center mt-2" style="font-size:.9rem;color:var(--muted)"><a href="/login.html" style="color:var(--green);font-weight:600">Back to Sign In</a></div>
  </div>
</div>
<script src="/static/js/api.js?v=4"></script>
<script>
let resendTimer;
function startResendCooldown(){
  const btn=document.getElementById("send-otp-btn");
  let seconds=60;
  clearInterval(resendTimer);
  btn.disabled=true;
  btn.textContent=`Resend OTP (${seconds}s)`;
  resendTimer=setInterval(()=>{
    seconds-=1;
    if(seconds<=0){clearInterval(resendTimer);btn.disabled=false;btn.textContent="Resend OTP";return}
    btn.textContent=`Resend OTP (${seconds}s)`;
  },1000);
}
async function sendResetOtp(){
  const email=document.getElementById("reset-email").value.trim(),err=document.getElementById("err"),btn=document.getElementById("send-otp-btn");
  err.style.display="none";
  if(!email){err.textContent="Enter your registered email.";err.style.display="block";return}
  btn.disabled=true;btn.innerHTML='<span class="loader"></span> Sending OTP…';
  try{
    const data=await API.forgotPassword(email);
    document.getElementById("reset-otp").value="";
    document.getElementById("new-password").value="";
    document.getElementById("reset-fields").style.display="block";
    showToast("If this email is registered, an OTP has been sent.","success");
    startResendCooldown();
  }catch(e){err.textContent=e.message||"Could not send OTP";err.style.display="block";btn.textContent="Send OTP";btn.disabled=false}
}
async function resetPassword(){
  const email=document.getElementById("reset-email").value.trim(),otp=document.getElementById("reset-otp").value.trim(),new_password=document.getElementById("new-password").value,err=document.getElementById("err");
  err.style.display="none";
  if(!otp||!new_password){err.textContent="Enter the OTP and a new password.";err.style.display="block";return}
  try{await API.resetPassword({email,otp,new_password});showToast("Password changed. Please sign in.","success");setTimeout(()=>window.location.href="/login.html",800)}
  catch(e){err.textContent=e.message||"Could not reset password";err.style.display="block"}
}
</script></body></html>
