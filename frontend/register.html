<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Register – AgriMarket</title><link rel="stylesheet" href="/static/css/style.css"/></head>
<body>
<div class="auth-page">
  <div class="auth-card" style="max-width:500px">
    <div class="auth-logo"><div class="icon">🌾</div><h1>Create Account</h1><p style="color:var(--muted);font-size:.9rem;margin-top:.25rem">Join AgriMarket for free</p></div>
    <input type="hidden" id="role" value="farmer"/>
    <div id="err" style="display:none;background:#fce4ec;color:#c62828;padding:.75rem 1rem;border-radius:8px;margin-bottom:1rem;font-size:.9rem"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.75rem">
      <div class="form-group" style="grid-column:1/-1"><label>Name *</label><input type="text" id="name" class="form-control" placeholder="Your full name"/></div>
      <div class="form-group"><label>Phone Number *</label><input type="tel" id="phone" class="form-control" placeholder="10-digit mobile"/></div>
      <div class="form-group"><label>Email</label><input type="email" id="email" class="form-control" placeholder="Optional"/></div>
      <div style="grid-column:1/-1;font-weight:600;color:var(--green);margin-top:.25rem">Address</div>
      <div class="form-group"><label>State *</label><select id="state" class="form-control"><option value="">Select state</option><option>Andhra Pradesh</option><option>Bihar</option><option>Gujarat</option><option>Haryana</option><option>Karnataka</option><option>Kerala</option><option>Madhya Pradesh</option><option>Maharashtra</option><option>Odisha</option><option>Punjab</option><option>Rajasthan</option><option>Tamil Nadu</option><option>Telangana</option><option>Uttar Pradesh</option><option>West Bengal</option></select></div>
      <div class="form-group"><label>District *</label><input type="text" id="district" class="form-control" placeholder="e.g. Coimbatore"/></div>
      <div class="form-group"><label>Taluk</label><input type="text" id="taluk" class="form-control" placeholder="Your taluk"/></div>
      <div class="form-group"><label>Area</label><input type="text" id="area" class="form-control" placeholder="Your area or village"/></div>
      <div class="form-group" style="grid-column:1/-1"><label>Door No. / Farm</label><input type="text" id="door-no-farm" class="form-control" placeholder="Door number or farm name"/></div>
      <div class="form-group"><label>Password *</label><input type="password" id="pwd" class="form-control" placeholder="Min 6 chars"/></div>
      <div class="form-group"><label>Confirm Password *</label><input type="password" id="cpwd" class="form-control" placeholder="Repeat"/></div>
    </div>
    <div style="margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--border)"><label style="font-weight:500;font-size:.9rem;display:block;margin-bottom:.5rem">What do you want to do? *</label><select id="purpose" class="form-control" onchange="selPurpose(this.value)"><option value="">Choose an option</option><option value="sell">Want to Sell</option><option value="buy">Want to Buy</option></select></div>
    <div id="purpose-fields" style="display:none;margin-top:1rem"><div class="form-group"><label id="product-interest-label">What do you want to sell? *</label><input type="text" id="product-interest" class="form-control" placeholder="Enter the products you want to sell" autocomplete="off"/></div><div class="form-group" id="farm-type-field"><label>Farm and agriculture details *</label><textarea id="farm-details" class="form-control" rows="3" placeholder="Tell us about your farm and agriculture type"></textarea></div></div>
    <button class="btn btn-green btn-full mt-2" id="btn" onclick="doRegister()">Create Account</button>
    <div class="text-center mt-2" style="font-size:.9rem;color:var(--muted)">Already have an account? <a href="/login.html" style="color:var(--green);font-weight:600">Sign In</a></div>
  </div>
</div>
<script src="/static/js/api.js?v=2"></script>
<script>
const params=new URLSearchParams(window.location.search);
if(params.get("role")==="buyer"){document.getElementById("purpose").value="buy";selPurpose("buy")}
function selPurpose(p){const selected=p==="sell"||p==="buy";document.getElementById("role").value=p==="sell"?"farmer":"buyer";document.getElementById("purpose-fields").style.display=selected?"block":"none";document.getElementById("product-interest-label").textContent=p==="sell"?"What do you want to sell? *":"What do you want to buy? *";document.getElementById("product-interest").placeholder=p==="sell"?"Enter the products you want to sell":"Enter the products you want to buy";document.getElementById("farm-type-field").style.display=p==="sell"?"block":"none"}
async function doRegister(){
  const err=document.getElementById("err"),btn=document.getElementById("btn");
  err.style.display="none";
  const purpose=document.getElementById("purpose").value;
  const district=document.getElementById("district").value.trim(),state=document.getElementById("state").value;
  const productInterest=document.getElementById("product-interest").value.trim();
  const data={full_name:document.getElementById("name").value.trim(),phone:document.getElementById("phone").value.trim(),email:document.getElementById("email").value.trim()||null,password:document.getElementById("pwd").value,role:document.getElementById("role").value,purpose,state,district,taluk:document.getElementById("taluk").value.trim()||null,area:document.getElementById("area").value.trim()||null,door_no_farm:document.getElementById("door-no-farm").value.trim()||null,products_to_sell:purpose==="sell"?productInterest:null,products_to_buy:purpose==="buy"?productInterest:null,farm_type:purpose==="sell"?document.getElementById("farm-details").value.trim()||null:null,farm_agriculture_details:purpose==="sell"?document.getElementById("farm-details").value.trim()||null:null};
  const cp=document.getElementById("cpwd").value;
  if(!data.full_name||!data.phone||!data.password){err.textContent="Fill in all required fields.";err.style.display="block";return}
  if(!state||!district){err.textContent="Please enter your state and district.";err.style.display="block";return}
  if(!purpose){err.textContent="Choose whether you want to sell or buy.";err.style.display="block";return}
  if(!productInterest){err.textContent=purpose==="sell"?"Enter what you want to sell.":"Enter what you want to buy.";err.style.display="block";return}
  if(purpose==="sell"&&!data.farm_agriculture_details){err.textContent="Enter your farm and agriculture details.";err.style.display="block";return}
  if(data.password!==cp){err.textContent="Passwords do not match.";err.style.display="block";return}
  btn.innerHTML='<span class="loader"></span> Creating…';btn.disabled=true;
  try{
    const res=await API.register(data);setAuth(res.access_token,res.refresh_token,res.user);
    showToast("Welcome to AgriMarket! 🎉","success");
    setTimeout(()=>{window.location.href=dashboardUrl(res.user)},800);
  }catch(e){err.textContent=e.message;err.style.display="block";btn.innerHTML="Create Account";btn.disabled=false}
}
</script></body></html>
